name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

  python:
    name: pytest (datatrove ${{ matrix.datatrove.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        datatrove:
          - { name: lowest, spec: "datatrove==0.10.1" }
          - { name: latest 0.10.x, spec: "datatrove>=0.10.1,<0.11" }
    steps:
      - uses: actions/checkout@v7
      # The shipped Unicode tables were exported from Python 3.13 (README "Unicode tables").
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Install wheel with test extra
        run: |
          wheel=$(ls dist/*.whl)
          python -m pip install "${wheel}[test]" "${{ matrix.datatrove.spec }}"
          python -m pip list | grep -iE "^(datatrove|spacy|xxhash) "
      - run: python -m pytest -q tests
