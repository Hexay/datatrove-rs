[workspace]
resolver = "2"
members = ["crates/spacy-tokenizer", "crates/datatrove-core", "crates/datatrove-py"]

[workspace.dependencies]
regex = "1.13"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
