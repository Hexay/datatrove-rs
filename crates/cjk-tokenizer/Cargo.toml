[package]
name = "cjk-tokenizer-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bit-exact ports of the Chinese (jieba) and Japanese (SudachiPy) tokenizers datatrove runs through spaCy"

[lib]
name = "cjk_tokenizer_rs"
path = "src/lib.rs"

[dependencies]
rustc-hash = { workspace = true }
serde_json = { workspace = true }
# The analyzer SudachiPy 0.7.0 is built from; datatrove's Japanese tokenizer is SudachiPy.
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", tag = "v0.7.0" }
