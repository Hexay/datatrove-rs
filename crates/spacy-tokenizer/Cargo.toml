[package]
name = "spacy-tokenizer-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bit-exact port of spaCy's rule-based Tokenizer"

[lib]
name = "spacy_tokenizer_rs"
path = "src/lib.rs"

[dependencies]
regex = { workspace = true }
regex-syntax = "0.8"
