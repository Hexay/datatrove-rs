[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "datatrove-rs"
version = "0.1.3"
description = "Drop-in Rust implementations of datatrove's hot pipeline steps: Gopher, C4, FineWeb filters and MinHash in 59 languages including Chinese and Japanese, plus readers, formatters and extraction"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Hexay" }]
requires-python = ">=3.10"
keywords = ["datatrove", "llm", "pretraining", "data-filtering", "deduplication", "minhash", "fineweb", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# datatrove imports `regex` in utils/text.py without declaring it.
dependencies = ["datatrove>=0.10.1,<0.11", "numpy", "regex"]

[project.urls]
Homepage = "https://github.com/Hexay/datatrove-rs"
Repository = "https://github.com/Hexay/datatrove-rs"
Issues = "https://github.com/Hexay/datatrove-rs/issues"

[project.optional-dependencies]
# datatrove 0.10's Python MinHash passes str to xxhash, which xxhash 4 rejects.
test = [
    "pytest", "pyarrow", "spacy>=3.8,<3.9", "xxhash<4", "tokenizers",
    # datatrove's WarcReader, URLFilter and LanguageFilter dependencies (+ fsspec HTTP for the lid model download)
    "warcio", "faust-cchardet", "python-magic", "tldextract", "pyahocorasick", "fasteners", "fasttext-numpy2-wheel",
    "requests", "aiohttp",
    # FTFYFormatter's unchanged-text check is built from ftfy's own regexes
    "ftfy>=6,<7",
    # datatrove's Chinese, Japanese, Thai, Indic and Vietnamese tokenizers, at the versions the Rust ports reproduce
    "jieba==0.42.1", "sudachipy==0.7.0", "sudachidict-core",
    "pythainlp==5.4.0", "python-crfsuite", "indic-nlp-library==0.92", "pyvi==0.1.1",
]
# Byte-exact Rust Trafilatura extractor; its own extra pins trafilatura/lxml to the versions it matches.
trafilatura = ["trafilatura-rs[trafilatura]>=0.1.1,<0.2"]

[tool.maturin]
manifest-path = "crates/datatrove-py/Cargo.toml"
python-source = "python"
module-name = "datatrove_rs._core"
# The release profile keeps debug info for perf; shipped wheels don't need it (16 MB -> a few MB).
strip = true
# Startup hook for zero-code adoption (DATATROVE_RS=1); must land at the wheel root, next to the package.
include = [{ path = "python/datatrove_rs.pth", format = "wheel" }]
